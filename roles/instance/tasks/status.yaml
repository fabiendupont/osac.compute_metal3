---
- name: Query BareMetalHost status
  kubernetes.core.k8s_info:
    api_version: metal3.io/v1alpha1
    kind: BareMetalHost
    name: "{{ item.inventory_hostname }}"
    namespace: "{{ metal3_namespace | default('openshift-machine-api') }}"
  register: _bmh_status
  loop: "{{ compute_instance_hosts }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"

- name: Set status facts
  ansible.builtin.set_fact:
    compute_instance_state: >-
      {{ 'RUNNING' if (_bmh_status.results | map(attribute='resources') | flatten |
         map(attribute='status.provisioning.state') | list | unique == ['provisioned'])
         else 'STARTING' }}
