---
- name: Remove NVLink partition
  nvidia.nmx.partition:
    name: "tenant-{{ compute_instance_tenant | default('unknown') }}"
    state: absent
  loop: "{{ compute_instance_hosts | selectattr('gpu_uuids', 'defined') | list }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"
  when: compute_instance_class.capabilities.gpus is defined
  ignore_errors: true

- name: Remove InfiniBand partition
  nvidia.ufm.pkey:
    pkey: "{{ compute_instance_tenant | default('0x0001') }}"
    guids: "{{ item.ib_guids }}"
    state: absent
  loop: "{{ compute_instance_hosts | selectattr('ib_guids', 'defined') | list }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"
  when: item.ib_guids is defined
  ignore_errors: true

- name: Deprovision BareMetalHost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metal3.io/v1alpha1
      kind: BareMetalHost
      metadata:
        name: "{{ item.inventory_hostname }}"
        namespace: "{{ metal3_namespace | default('openshift-machine-api') }}"
      spec:
        online: false
  loop: "{{ compute_instance_hosts }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"

- name: Wait for BareMetalHost deprovisioning
  kubernetes.core.k8s_info:
    api_version: metal3.io/v1alpha1
    kind: BareMetalHost
    name: "{{ item.inventory_hostname }}"
    namespace: "{{ metal3_namespace | default('openshift-machine-api') }}"
  register: _bmh_status
  until: _bmh_status.resources[0].status.provisioning.state | default('') in ['available', 'ready']
  retries: "{{ metal3_deprovision_retries | default(30) }}"
  delay: "{{ metal3_deprovision_delay | default(30) }}"
  loop: "{{ compute_instance_hosts }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"

- name: Clean up userdata secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item.inventory_hostname }}-userdata"
    namespace: "{{ metal3_namespace | default('openshift-machine-api') }}"
  loop: "{{ compute_instance_hosts }}"
  loop_control:
    label: "{{ item.inventory_hostname }}"
